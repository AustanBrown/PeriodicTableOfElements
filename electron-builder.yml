appId: com.austanbrown.periodictableofelements
productName: Periodic Table of Elements
copyright: Copyright © AustanBrown

directories:
  output: release
  buildResources: build

# Where `electron-builder --publish` uploads to, and where the app's updater looks.
# Stated explicitly rather than inferred from the git remote, which breaks in CI and
# in source tarballs. Releases are drafts: electron-updater ignores those, so users
# are never offered a build whose assets are still uploading.
publish:
  provider: github
  owner: AustanBrown
  repo: PeriodicTableOfElements
  releaseType: draft

# ${name} is the package name, which has no spaces. The default naming uses
# productName, and the resulting space-to-dash substitution in the update metadata
# no longer matched the files on disk.
artifactName: ${name}-${version}-${os}-${arch}.${ext}

# The Vue app is bundled into dist/ by `vite build`; the element JSON is inlined
# into that bundle, so nothing from data/ needs shipping separately.
files:
  - dist/**/*
  - electron/**/*
  - package.json

linux:
  target:
    - AppImage
    - deb
  category: Education
  icon: build/icon.png
  synopsis: A periodic table of the elements
  # Required by the .deb target; change this to your own contact address.
  maintainer: AustanBrown <AustanBrown@users.noreply.github.com>
  # Lets desktop environments associate the running window with the .desktop entry.
  syncDesktopName: true
  desktop:
    entry:
      Keywords: chemistry;science;elements;periodic table;

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
    # The macOS updater installs from a zip, never a dmg. Without this there is no
    # artifact for latest-mac.yml to point at, and the check itself fails.
    - zip
  category: public.app-category.education
  icon: build/icon.png
